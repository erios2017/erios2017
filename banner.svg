<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="0.55" stop-color="#0f2a47"/>
      <stop offset="1" stop-color="#1b6ca8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#00a1e0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .name{font:700 64px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .role{font:500 26px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#cfe6ff}
      .tag{font:600 16px ui-monospace,'Cascadia Code',Consolas,monospace;fill:#7dd3fc}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .float{animation:f 6s ease-in-out infinite}
      @keyframes f{50%{transform:translateY(-8px)}}
    </style>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <g class="float" opacity="0.9">
    <circle cx="1030" cy="120" r="70" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
    <ellipse cx="1030" cy="120" rx="120" ry="34" fill="none" stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="2" transform="rotate(-18 1030 120)"/>
    <circle cx="1030" cy="120" r="22" fill="url(#accent)"/>
    <circle cx="1140" cy="88" r="7" fill="#e0f2fe"/>
  </g>
  <text x="70" y="78" class="tag">&gt; hola_mundo<tspan class="blink">_</tspan></text>
  <text x="70" y="150" class="name">Ezequiel Ríos</text>
  <rect x="72" y="168" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="214" class="role">Desarrollador Salesforce &amp; Full Stack · Freelance</text>
</svg>
